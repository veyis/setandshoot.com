packages:
  - "."
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js: false
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@types/node@26.2.0'
  - '@aws-sdk/client-s3@3.1106.0'
  - '@aws-sdk/s3-request-presigner@3.1106.0'
  - eslint@10.8.1
